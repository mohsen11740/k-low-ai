<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1422"><title>k-low | مشاوره حقوقی خانم کربلایی</title><style>
:root{--navy:#0b1422;--navy2:#14243a;--gold:#d9b66f;--cream:#f7f2e8;--ink:#172033;--muted:#738093;--line:#e5dfd3}*{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:var(--ink);font-family:Tahoma,"Vazirmatn",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:0 0 40px #0001}.top{background:linear-gradient(135deg,#0b1422,#1b2b40);color:#fff;padding:23px 20px 25px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}.top:after{content:'⚖';position:absolute;left:14px;top:15px;font-size:82px;color:#d9b66f16}.brand{display:flex;align-items:center;gap:12px;position:relative;flex-wrap:wrap}.mark{width:49px;height:49px;border:1.5px solid var(--gold);border-radius:16px;display:grid;place-items:center;color:var(--gold);font-size:27px;font-weight:bold}.top-call{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--gold);color:#172033;padding:9px 10px;border-radius:11px;font-size:10px;font-weight:bold;white-space:nowrap;position:relative;z-index:2}.brand h1{margin:0;font-size:21px;letter-spacing:.2px}.brand p{margin:5px 0 0;color:#c7d0dd;font-size:11px}.welcome{margin-top:25px;position:relative}.welcome small{color:var(--gold)}.welcome h2{font-size:22px;line-height:1.65;margin:8px 0}.welcome p{font-size:12px;color:#c6cfdb;line-height:1.9;margin:0}.content{padding:18px 16px 90px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 13px}.section-title h3{margin:0;font-size:16px}.section-title span{font-size:11px;color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px 13px;min-height:126px;text-align:right;box-shadow:0 5px 14px #1b2b4008;color:var(--ink)}.tile:active{transform:scale(.98)}.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#f7f0df;color:#9c762e;font-size:21px;margin-bottom:12px}.tile b{display:block;font-size:13px}.tile small{display:block;color:var(--muted);font-size:10px;line-height:1.7;margin-top:6px}.wide{margin-top:16px;border-radius:17px;padding:16px;background:linear-gradient(115deg,#17283e,#0b1422);color:white;display:flex;align-items:center;gap:13px}.wide .ico{flex-shrink:0;margin:0;background:#d9b66f20;color:var(--gold)}.wide b{font-size:13px}.wide p{font-size:11px;line-height:1.8;color:#cbd4e0;margin:5px 0 0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:12px}.panel h3{margin:0 0 6px;font-size:17px}.hint{font-size:11px;color:var(--muted);line-height:1.9;margin:0 0 15px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd6c9;border-radius:11px;background:#fff;padding:12px;color:#172033;outline:none;font-size:13px}.field textarea{min-height:100px;resize:vertical;line-height:1.9}.field input:focus,.field textarea:focus,.field select:focus{border-color:#c5a45e;box-shadow:0 0 0 3px #d9b66f20}.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--navy);color:white;font-weight:bold;font-size:13px;width:100%;margin-top:7px}.btn.gold{background:var(--gold);color:#1b2432}.btn.ghost{background:#f4efe5;color:#293448;border:1px solid var(--line)}.back{border:0;background:transparent;color:var(--gold);font-size:13px;padding:0 0 17px}.result{background:#fffdf8;border:1px solid #d8c79e;border-radius:14px;padding:14px;white-space:pre-wrap;line-height:2;font-size:13px;min-height:120px;overflow-wrap:anywhere}.notice{font-size:10px;color:#776642;line-height:1.9;background:#faf3df;border-radius:11px;padding:11px;margin-top:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:#0b1422;color:#aeb8c7;padding:11px 5px calc(11px + env(safe-area-inset-bottom));z-index:5;border-radius:17px 17px 0 0}.bottom button{border:0;background:none;color:inherit;font-size:10px;display:flex;flex-direction:column;gap:5px;align-items:center}.bottom button span{font-size:18px}.bottom button.active{color:var(--gold)}.empty{text-align:center;color:var(--muted);font-size:12px;padding:24px 5px;line-height:2}.saved-item{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;background:#fff}.saved-item b{font-size:13px}.saved-item p{font-size:11px;color:var(--muted);margin:7px 0}.saved-item button{width:auto;padding:8px 12px;margin-left:5px;font-size:11px}.footer{text-align:center;color:#777;font-size:10px;line-height:1.9;margin-top:22px;padding:14px 8px;border-top:1px solid var(--line)}.ai-badge{display:inline-block;background:#e8f2e9;color:#25613a;padding:4px 8px;border-radius:20px;font-size:10px;margin-bottom:8px}.busy{opacity:.7;pointer-events:none}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark">K</div><div><h1>k-low <span style="color:#d9b66f">KARBALAEI LAW</span></h1><p>مشاوره حقوقی خانم کربلایی</p></div><a class="top-call" href="tel:09335770175">☎ مشاوره با خانم کربلایی</a></div><div class="welcome"><small>همراه شما در مسیر آگاهی حقوقی</small><h2>حقوق خود را بشناسید.<br>آگاهانه‌تر تصمیم بگیرید.</h2><p>مشاوره، تنظیم پیش‌نویس اسناد و درخواست ارتباط با دفتر حقوقی، در یک فضای یکپارچه.</p></div></header><main id="main" class="content"></main><nav class="bottom"><button class="active" data-tab="home"><span>⌂</span>خانه</button><button data-tab="saved"><span>▤</span>پیش‌نویس‌ها</button><button data-tab="guide"><span>✧</span>راهنما</button><button data-tab="about"><span>ⓘ</span>درباره</button></nav></div><script>
const services=[{id:'consult',icon:'⚖',name:'مشاوره حقوقی',desc:'شرح مسئله و دریافت راهنمای اولیه'},{id:'notice',icon:'✉',name:'اظهارنامه',desc:'تنظیم پیش‌نویس اظهارنامه'},{id:'petition',icon:'▤',name:'دادخواست',desc:'ثبت خواسته و شرح دادخواست'},{id:'complaint',icon:'⚑',name:'شکواییه',desc:'تنظیم پیش‌نویس شکایت'},{id:'brief',icon:'✎',name:'لایحه',desc:'تدوین دفاعیات و توضیحات'},{id:'tracking',icon:'◷',name:'پیگیری پرونده',desc:'یادداشت تاریخ‌ها و اقدامات'},{id:'request',icon:'☎',name:'درخواست مشاوره و وکالت',desc:'ثبت درخواست و تماس مستقیم'}];let tab='home',current=null;const main=document.getElementById('main');const getSaved=()=>JSON.parse(localStorage.getItem('karloDrafts')||'[]');const setSaved=x=>localStorage.setItem('karloDrafts',JSON.stringify(x));function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){main.innerHTML=`<div class="section-title"><h3>خدمات حقوقی</h3><span>انتخاب کنید و شروع کنید</span></div><div class="tiles">${services.map(s=>`<button class="tile" onclick="openService('${s.id}')"><div class="ico">${s.icon}</div><b>${s.name}</b><small>${s.desc}</small></button>`).join('')}</div><button class="wide" style="width:100%;border:0;text-align:right" onclick="openService('request')"><div class="ico">☎</div><div><b>درخواست مشاوره و وکالت</b><p>شرح درخواست را ثبت کنید یا مستقیماً با شماره ۰۹۳۳۵۷۷۰۱۷۵ تماس بگیرید.</p></div></button><button class="wide" style="width:100%;border:0;text-align:right" onclick="contactMe()"><div class="ico">✆</div><div><b>ارتباط با حقوق کربلایی</b><p>تماس مستقیم با شماره ۰۹۳۳۵۷۷۰۱۷۵</p></div></button><div class="footer">حقوق این نرم‌افزار متعلق به خانم نسرین کربلایی می‌باشد.</div>`}
const config={request:{title:'درخواست مشاوره و وکالت',intro:'اطلاعات تماس و خلاصه درخواست را وارد کنید. برای پیگیری سریع‌تر می‌توانید مستقیماً با شماره ۰۹۳۳۵۷۷۰۱۷۵ تماس بگیرید. ارسال این فرم در نسخه فعلی فقط پیش‌نویس را روی دستگاه نگه می‌دارد و به دفتر ارسال نمی‌کند.',fields:[['name','نام و نام خانوادگی','text','نام شما'],['phone','شماره تماس شما','text','شماره‌ای برای تماس'],['service','نوع درخواست','select','مشاوره حقوقی|درخواست قبول وکالت|تنظیم سند حقوقی|پیگیری درخواست قبلی'],['topic','موضوع پرونده','text','مثلاً خانواده، ملکی، قرارداد، کیفری'],['story','شرح کوتاه درخواست','textarea','خلاصه موضوع، مهلت مهم و کمکی که نیاز دارید']]},consult:{title:'مشاوره حقوقی',intro:'مسئله‌تان را با جزئیات بنویسید تا برای بررسی حقوقی و آماده‌شدن برای مشاوره، نکات اصلی را مرتب کنیم.',fields:[['topic','موضوع یا حوزه مسئله','text','مثلاً قرارداد، خانواده، ملک، کار'],['story','شرح ماجرا','textarea','چه اتفاقی افتاده؟ تاریخ‌ها و اشخاص مرتبط را بنویسید.'],['goal','نتیجه‌ای که می‌خواهید','textarea','می‌خواهید به چه نتیجه‌ای برسید؟'],['city','شهر محل رسیدگی','text','مثلاً تهران یا کرج']]},notice:{title:'تنظیم اظهارنامه',intro:'اطلاعات را وارد کنید. متن زیر یک پیش‌نویس اولیه است و باید پیش از ارسال بررسی شود.',fields:[['sender','نام اظهارکننده','text','نام و نام خانوادگی'],['receiver','نام مخاطب','text','نام و نام خانوادگی یا شخص حقوقی'],['subject','موضوع اظهارنامه','text','مثلاً مطالبه وجه یا ایفای تعهد'],['story','شرح موضوع و خواسته','textarea','شرح دقیق، تاریخ‌ها، مبلغ و مهلت موردنظر'],['date','تاریخ یا مهلت پاسخ','text','در صورت نیاز']]},petition:{title:'تنظیم دادخواست',intro:'خواسته و شرح ادعا را وارد کنید تا یک پیش‌نویس منظم برای بازبینی تهیه شود.',fields:[['plaintiff','خواهان','text','نام و نام خانوادگی'],['defendant','خوانده','text','نام و نام خانوادگی یا شخص حقوقی'],['claim','خواسته','text','خواسته دقیق شما'],['value','بهای خواسته (در صورت نیاز)','text','مبلغ به ریال یا تومان'],['story','شرح دادخواست','textarea','ماجرا، مستندات و آنچه از دادگاه می‌خواهید'],['evidence','دلایل و پیوست‌ها','textarea','قرارداد، رسید، پیامک، شهادت و...']]},complaint:{title:'تنظیم شکواییه',intro:'شرح واقعه و اطلاعات مربوط را بنویسید. عنوان مجرمانه نهایی باید با توجه به جزئیات و قانون بررسی شود.',fields:[['complainant','شاکی','text','نام و نام خانوادگی'],['accused','مشتکی‌عنه','text','نام شخص یا در صورت نامشخص بودن، توضیح'],['subject','موضوع شکایت','text','شرح کوتاه واقعه'],['story','شرح واقعه','textarea','زمان، مکان، نحوه وقوع و افراد حاضر'],['evidence','دلایل و مدارک','textarea','مدارک، شاهدان و مستندات موجود']]},brief:{title:'تنظیم لایحه',intro:'برای تنظیم پیش‌نویس دفاعیه، مرجع رسیدگی و نکات اصلی پرونده را وارد کنید.',fields:[['court','مرجع رسیدگی / شعبه','text','مثلاً شعبه ... دادگاه ...'],['case','شماره پرونده (اختیاری)','text','شماره پرونده یا بایگانی'],['role','سمت شما در پرونده','select','خواهان|خوانده|شاکی|متهم|تجدیدنظرخواه|تجدیدنظرخوانده'],['story','خلاصه پرونده و دفاعیات','textarea','موضوع پرونده و پاسخ شما به ادعاها'],['evidence','دلایل و مستندات','textarea','اسناد و نکات حقوقی مهم']]},tracking:{title:'یادداشت پیگیری پرونده',intro:'اطلاعات را برای یادآوری و نظم شخصی ذخیره کنید. این بخش به سامانه قضایی متصل نیست.',fields:[['case','عنوان یا شماره پرونده','text','نام کوتاه یا شماره پرونده'],['date','تاریخ مهم','text','مثلاً ۱۴۰۵/۰۸/۲۰'],['action','اقدام بعدی','textarea','چه کاری باید انجام دهید؟'],['notes','یادداشت','textarea','توضیحات تکمیلی']]}};
function openService(id){current=id;const c=config[id];if(!c){return}main.innerHTML=`<button class="back" onclick="goHome()">← بازگشت به خانه</button><div class="panel"><h3>${c.title}</h3><p class="hint">${c.intro}</p><form id="entry">${c.fields.map(f=>`<div class="field"><label>${f[1]}</label>${f[2]==='textarea'?`<textarea name="${f[0]}" placeholder="${f[3]}" required="${['story'].includes(f[0])}"></textarea>`:f[2]==='select'?`<select name="${f[0]}">${f[3].split('|').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${f[0]}" type="text" placeholder="${f[3]}" ${['topic','sender','receiver','claim','complainant','court'].includes(f[0])?'required':''}>`}</div>`).join('')}<button class="btn gold" type="submit">تهیه پیش‌نویس</button></form></div><div id="output"></div>`;document.getElementById('entry').addEventListener('submit',e=>{e.preventDefault();generate(id,new FormData(e.target))})}
function generateTemplate(id,fd){const c=config[id],d=Object.fromEntries(fd.entries());let text='';if(id==='request'){text=`درخواست مشاوره و وکالت | پیش‌نویس
نام: ${d.name||'—'}
شماره تماس متقاضی: ${d.phone||'—'}
نوع درخواست: ${d.service||'—'}
موضوع پرونده: ${d.topic||'—'}

شرح درخواست:
${d.story||'—'}

شماره تماس حقوق کربلایی: ۰۹۳۳۵۷۷۰۱۷۵
این فرم در نسخه فعلی به‌صورت محلی ذخیره می‌شود و برای دفتر ارسال نشده است. برای ثبت واقعی درخواست با شماره بالا تماس بگیرید.`}else if(id==='consult'){text=`خلاصه مسئله برای مشاوره حقوقی\nموضوع: ${d.topic||'—'}\nشهر: ${d.city||'—'}\n\nشرح ماجرا:\n${d.story||'—'}\n\nنتیجه موردنظر:\n${d.goal||'—'}\n\nنکات آماده‌سازی:\n۱. تاریخ دقیق اتفاق‌ها را مشخص کنید.\n۲. قراردادها، رسیدها و مکاتبات را نگه دارید.\n۳. مهلت‌های قانونی احتمالی را سریعاً با وکیل بررسی کنید.\n۴. پیش از اقدام، قوانین و مدارک پرونده بررسی شود.`}else if(id==='tracking'){text=`یادداشت پیگیری پرونده\nعنوان/شماره: ${d.case||'—'}\nتاریخ مهم: ${d.date||'—'}\n\nاقدام بعدی:\n${d.action||'—'}\n\nیادداشت:\n${d.notes||'—'}`}else if(id==='notice'){text=`اظهارنامه | پیش‌نویس جهت بازبینی\nاظهارکننده: ${d.sender||'—'}\nمخاطب: ${d.receiver||'—'}\nموضوع: ${d.subject||'—'}\n\nمخاطب محترم،\nبا سلام؛\nاحتراماً، در خصوص ${d.subject||'موضوع فوق'} به اطلاع می‌رساند:\n${d.story||'شرح موضوع درج شود.'}\n\nخواهشمند است در مهلت ${d.date||'متعارف و قانونیِ قابل اعمال'} نسبت به انجام تعهد/رسیدگی به موضوع اقدام نمایید. این متن باید با توجه به قرارداد، ادله و مقررات مربوط تکمیل و بررسی شود.\n\nنام و امضا: ${d.sender||'—'}`}else if(id==='petition'){text=`پیش‌نویس دادخواست برای بازبینی\nخواهان: ${d.plaintiff||'—'}\nخوانده: ${d.defendant||'—'}\nخواسته: ${d.claim||'—'}\nبهای خواسته: ${d.value||'حسب مورد'}\n\nشرح دادخواست:\n${d.story||'شرح ادعا درج شود.'}\n\nدلایل و منضمات:\n${d.evidence||'مدارک و مستندات درج شود.'}\n\nخواسته نهایی و مرجع صالح باید با توجه به قانون و جزئیات پرونده تعیین و قبل از ثبت بررسی شود.`}else if(id==='complaint'){text=`پیش‌نویس شکواییه برای بازبینی\nشاکی: ${d.complainant||'—'}\nمشتکی‌عنه: ${d.accused||'—'}\nموضوع اعلامی: ${d.subject||'—'}\n\nشرح واقعه:\n${d.story||'شرح واقعه درج شود.'}\n\nدلایل و مستندات:\n${d.evidence||'دلایل درج شود.'}\n\nتقاضا: رسیدگی و اتخاذ تصمیم قانونی پس از بررسی موضوع و دلایل. عنوان اتهام و مرجع صالح باید توسط متخصص و بر اساس جزئیات بررسی شود.`}else{text=`پیش‌نویس لایحه برای بازبینی\nمرجع رسیدگی: ${d.court||'—'}\nشماره پرونده: ${d.case||'—'}\nسمت: ${d.role||'—'}\n\nریاست محترم مرجع رسیدگی\nبا سلام و احترام؛\nدر خصوص پرونده فوق، مطالب و دفاعیات اینجانب به شرح زیر تقدیم می‌شود:\n\n${d.story||'شرح دفاعیات درج شود.'}\n\nدلایل و مستندات:\n${d.evidence||'مستندات درج شود.'}\n\nبا احترام\nنام و امضا: ...\n\nاین پیش‌نویس باید با پرونده و قوانین قابل اعمال تطبیق داده شود.`}const out=document.getElementById('output');out.innerHTML=`<div class="panel"><h3>پیش‌نویس شما آماده است</h3><p class="hint">متن را بررسی و در صورت نیاز اصلاح کنید.</p><div class="field"><textarea id="draftText" style="min-height:300px">${escapeHtml(text)}</textarea></div><button class="btn" onclick="saveDraft()">ذخیره پیش‌نویس</button><button class="btn ghost" onclick="copyDraft()">کپی متن</button><button class="btn ghost" onclick="printDraft()">چاپ / ذخیره PDF</button><div class="notice">این متن به‌صورت خودکار و بر پایه اطلاعات واردشده ساخته شده است؛ نظر حقوقی تخصصی یا تضمین پذیرش در مرجع قضایی نیست. پیش از استفاده، آن را با وکیل یا کارشناس حقوقی بررسی کنید.</div></div>`;out.scrollIntoView({behavior:'smooth',block:'start'})}
function getAiEndpoint(){return localStorage.getItem('karloAiEndpoint')||'/api/legal-draft'}
function saveAiEndpoint(){const el=document.getElementById('aiEndpoint');if(!el)return;const v=el.value.trim();if(v&&!v.startsWith('/api/')&&!/^https:\/\//i.test(v)){alert('آدرس سرویس باید با https:// یا مسیر داخلی /api/ شروع شود.');return}localStorage.setItem('karloAiEndpoint',v);const st=document.getElementById('aiStatus');if(st)st.textContent=v?'آدرس سرویس ذخیره شد. برای پاسخ واقعی، سرور باید فعال و در دسترس باشد.':'اتصال هوش مصنوعی پاک شد؛ برنامه از متن‌ساز محلی استفاده می‌کند.';}
async function testAiEndpoint(){saveAiEndpoint();const url=getAiEndpoint(),st=document.getElementById('aiStatus');if(!url){if(st)st.textContent='هنوز آدرس سرویس ثبت نشده است.';return}if(st)st.textContent='در حال آزمایش اتصال…';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'فقط پاسخ بده: اتصال برقرار است.',context:{app:'حقوق کربلایی',task:'connection_test'}})});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(st)st.textContent='پاسخ از سرویس دریافت شد. ساختار پاسخ: '+(j.text||j.answer||j.response?'معتبر':'نیازمند هماهنگ‌سازی با سرویس');}catch(e){if(st)st.textContent='اتصال برقرار نشد. آدرس، اینترنت و فرمت پاسخ سرور را بررسی کنید. ('+e.message+')'}}
async function generate(id,fd){
  const d=Object.fromEntries(fd.entries());
  generateTemplate(id,fd);
  const out=document.getElementById('output'); if(!out)return;
  const area=out.querySelector('#draftText'); if(!area)return;
  const url=getAiEndpoint();
  if(!url){const notice=out.querySelector('.notice');if(notice)notice.innerHTML='این متن در حالت فعلی با قالب‌ساز داخلی تهیه شده است، نه هوش مصنوعی آنلاین. برای فعال‌کردن پاسخ‌های هوشمند، آدرس سرویس امن را در «راهنما» تنظیم کنید. پیش از استفاده قضایی، متن را بازبینی کنید.';return;}
  const original=area.value; const status=document.createElement('div');status.className='notice';status.textContent='در حال نگارش و بازبینی متن با هوش مصنوعی…';area.parentElement.insertBefore(status,area);
  try{
    const prompt=`تو دستیار نگارش حقوقی فارسی در اپ «حقوق کربلایی» هستی. بر اساس اطلاعات کاربر یک متن دقیق، حرفه‌ای، منظم، رسمی و قابل ویرایش تولید کن. هیچ واقعیت، تاریخ، ماده قانونی، رأی یا مدرکی را جعل نکن. اگر اطلاعات کافی نیست، جاهای خالی مشخص کن و در پایان موارد لازم برای تکمیل را فهرست کن. قانون قابل اعمال و صلاحیت مرجع را قطعی اعلام نکن مگر مطمئن باشی. پاسخ را به فارسی و راست‌چین، با تیترهای روشن بنویس. برای مشاوره، مسئله را تحلیل کن، اطلاعات ناقص را مشخص کن، گزینه‌های قانونی محتمل و ریسک‌ها و گام‌های بعدی را بگو. این متن جایگزین بررسی وکیل نیست. نوع خدمت: ${config[id]?.title||id}. اطلاعات کاربر: ${JSON.stringify(d)}. متن اولیه: ${original}`;
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:prompt,task:id,form:d,context:{app:'حقوق کربلایی',language:'fa-IR',output_format:'legal_draft'}})});
    if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const answer=j.text||j.answer||j.response||j.output;if(typeof answer!=='string'||!answer.trim())throw new Error('پاسخ متنی در خروجی سرویس پیدا نشد');area.value=answer.trim();status.className='ai-badge';status.textContent='پیش‌نویس با کمک هوش مصنوعی آماده شد';
    const notice=out.querySelector('.notice:last-child');if(notice)notice.textContent='متن با کمک سرویس هوش مصنوعی تنظیم شده است. صحت اطلاعات، مواد قانونی، صلاحیت مرجع و مهلت‌ها را قبل از ارسال با متخصص بررسی کنید.';
  }catch(e){status.textContent='پاسخ هوش مصنوعی دریافت نشد؛ متن اولیه حفظ شده است. اتصال سرویس را بررسی کنید.';status.className='notice';}
}
function saveDraft(){const title=config[current]?.title||'پیش‌نویس';const content=document.getElementById('draftText').value;let arr=getSaved();arr.unshift({id:Date.now(),title,content,date:new Date().toLocaleDateString('fa-IR')});setSaved(arr);alert('پیش‌نویس در همین دستگاه ذخیره شد.');}function copyDraft(){const el=document.getElementById('draftText');el.select();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(el.value).then(()=>alert('متن کپی شد.')).catch(()=>{document.execCommand('copy');alert('متن کپی شد.')})}else{document.execCommand('copy');alert('متن کپی شد.')}}function printDraft(){const t=document.getElementById('draftText').value;const w=window.open('','_blank');if(!w){alert('برای چاپ، اجازه بازشدن پنجره را بدهید.');return}w.document.write(`<html lang="fa" dir="rtl"><meta charset="utf-8"><title>پیش‌نویس حقوقی</title><style>body{font-family:Tahoma,Arial;padding:35px;line-height:2;white-space:pre-wrap}</style><body>${escapeHtml(t)}</body></html>`);w.document.close();w.focus();w.print()}
function saved(){const arr=getSaved();main.innerHTML=`<div class="section-title"><h3>پیش‌نویس‌های من</h3><span>ذخیره‌شده روی همین دستگاه</span></div>${arr.length?arr.map(x=>`<div class="saved-item"><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.date)}</p><button class="btn ghost" onclick="viewSaved(${x.id})">مشاهده</button><button class="btn ghost" onclick="deleteSaved(${x.id})">حذف</button></div>`).join(''):`<div class="empty">هنوز پیش‌نویسی ذخیره نکرده‌اید.<br>پس از تهیه متن، روی «ذخیره پیش‌نویس» بزنید.</div>`}`};function viewSaved(id){const x=getSaved().find(a=>a.id===id);if(!x)return;main.innerHTML=`<button class="back" onclick="saved()">← بازگشت</button><div class="panel"><h3>${escapeHtml(x.title)}</h3><div class="field"><textarea id="draftText" style="min-height:400px">${escapeHtml(x.content)}</textarea></div><button class="btn" onclick="copyDraft()">کپی متن</button><button class="btn ghost" onclick="printDraft()">چاپ / ذخیره PDF</button></div>`}function deleteSaved(id){if(confirm('این پیش‌نویس حذف شود؟')){setSaved(getSaved().filter(x=>x.id!==id));saved()}}
function guide(){main.innerHTML=`<div class="section-title"><h3>راهنمای استفاده</h3><span>چند نکته مهم</span></div><div class="panel"><h3>قبل از تنظیم سند</h3><p class="hint">۱. اطلاعات را دقیق و بدون حدس وارد کنید.<br>۲. تاریخ‌ها، مبالغ و مشخصات اشخاص را دوباره بررسی کنید.<br>۳. مدارک و مکاتبات را نگه دارید.<br>۴. مهلت‌های قانونی را از متخصص بپرسید.<br>۵. متن نهایی را پیش از ثبت یا ارسال بررسی کنید.</p><div class="field"><label>آدرس سرویس هوش مصنوعی (اختیاری)</label><input id="aiEndpoint" type="url" placeholder="https://your-server.example/api/legal-assistant" value="/api/legal-draft"></div><button class="btn gold" onclick="saveAiEndpoint()">ذخیره اتصال هوش مصنوعی</button><button class="btn ghost" onclick="testAiEndpoint()">آزمایش اتصال</button><p id="aiStatus" class="hint">اتصال پیش‌فرض از مسیر امن همین سایت انجام می‌شود. کلید API در مرورگر قرار نمی‌گیرد.</p><div class="notice">پس از اتصال سرویس، بخش‌های مشاوره، اظهارنامه، دادخواست، شکواییه، لایحه و سایر فرم‌ها پاسخ هوش مصنوعی دریافت می‌کنند. بدون اتصال، برنامه متن پیش‌نویس محلی تولید می‌کند.</div></div>`;const ep=document.getElementById('aiEndpoint');if(ep)ep.value=getAiEndpoint()}function contactMe(){main.innerHTML=`<div class="panel" style="text-align:center;padding:28px 18px"><div class="mark" style="margin:auto;width:65px;height:65px;font-size:34px">K</div><h2>مشاوره با خانم کربلایی</h2><p class="hint">برای درخواست مشاوره حقوقی، بررسی امکان قبول وکالت یا پرسش درباره خدمات، از شماره زیر استفاده کنید.</p><a class="btn" style="display:block;text-decoration:none" href="tel:09335770175">تماس با ۰۹۳۳۵۷۷۰۱۷۵</a><a class="btn ghost" style="display:block;text-decoration:none" href="https://wa.me/989335770175">گفت‌وگو در واتساپ</a><div class="notice" style="text-align:right">لطفاً اطلاعات حساس، رمزها و اطلاعات بانکی را ارسال نکنید. در نسخه فعلی، ثبت فرم درخواست به معنی ارسال آن برای دفتر نیست.</div><button class="btn ghost" onclick="goHome()">بازگشت به خانه</button></div>`}function about(){main.innerHTML=`<div class="panel" style="text-align:center;padding:28px 18px"><div class="mark" style="margin:auto;width:65px;height:65px;font-size:34px">K</div><h2 style="margin-bottom:4px">حقوق کربلایی</h2><p class="hint">دستیار حقوقی و تنظیم پیش‌نویس اسناد</p><p class="hint">مشاوره اولیه، تنظیم پیش‌نویس و راهنمای آماده‌سازی مدارک در یک برنامه فارسی.</p><a class="btn" style="display:block;text-decoration:none" href="tel:09335770175">مشاوره با خانم کربلایی: ۰۹۳۳۵۷۷۰۱۷۵</a><div class="notice" style="text-align:right">حقوق این نرم‌افزار متعلق به خانم نسرین کربلایی می‌باشد. این برنامه جایگزین بررسی تخصصی پرونده یا سامانه رسمی قضایی نیست. اطلاعات پرونده را محرمانه نگه دارید و از واردکردن اطلاعات غیرضروری خودداری کنید.</div><p class="footer">نسخه نمایشی ۰.۲</p></div>`}function goHome(){tab='home';updateNav();home()}function updateNav(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;updateNav();({home,saved,guide,about}[tab]||home)()}));home();
const footerObserver=new MutationObserver(()=>{const old=main.querySelector('.legal-footer');if(!old){const f=document.createElement('div');f.className='footer legal-footer';f.textContent='حقوق این نرم‌افزار متعلق به خانم نسرین کربلایی می‌باشد.';main.appendChild(f);}});footerObserver.observe(main,{childList:true});
</script></body></html>
