const REMINDERS_KEY='kLowCaseReminders';

function normalizeDigits(value){return String(value||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
function jalaliToGregorian(jy,jm,jd){jy=Number(jy);jm=Number(jm);jd=Number(jd);if(!Number.isInteger(jy)||!Number.isInteger(jm)||!Number.isInteger(jd)||jm<1||jm>12||jd<1||jd>(jm<=6?31:jm<=11?30:30))return null;let y=jy+1595;let days=-355668+365*y+Math.floor(y/33)*8+Math.floor(((y%33)+3)/4)+jd+(jm<7?(jm-1)*31:((jm-7)*30)+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const leap=(gy%4===0&&gy%100!==0)||gy%400===0;const months=[0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];let gm=1;while(gm<=12&&gd>months[gm]){gd-=months[gm];gm++}if(jm===12&&jd>29){const last=gregorianToJalali(gy,gm,gd);if(last[1]!==12||last[2]!==jd)return null}return `${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`}
function gregorianToJalali(gy,gm,gd){gy=Number(gy);gm=Number(gm);gd=Number(gd);const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+(days%31)}else{jm=7+Math.floor((days-186)/30);jd=1+((days-186)%30)}return [jy,jm,jd]}
function parseJalaliInput(value){const raw=normalizeDigits(value).trim().replace(/[.\-]/g,'/');const m=raw.match(/^(\d{4})\s*\/\s*(\d{1,2})\s*\/\s*(\d{1,2})$/);if(!m)return null;const jy=Number(m[1]),jm=Number(m[2]),jd=Number(m[3]);if(jm<1||jm>12||jd<1||jd>(jm<=6?31:jm<=11?30:30))return null;const iso=jalaliToGregorian(jy,jm,jd);if(!iso)return null;const back=gregorianToJalali(...iso.split('-').map(Number));if(back[0]!==jy||back[1]!==jm||back[2]!==jd)return null;return {iso,jy,jm,jd}}
const jalaliMonthNames=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];const jalaliWeekNames=['ش','ی','د','س','چ','پ','ج'];let jalaliViewYear=null,jalaliViewMonth=null;
function persianDigits(value){return String(value).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)])}
function jalaliMonthLength(y,m){for(let d=31;d>=28;d--){const iso=jalaliToGregorian(y,m,d);if(iso){const back=gregorianToJalali(...iso.split('-').map(Number));if(back[0]===y&&back[1]===m&&back[2]===d)return d}}return 29}
function openJalaliCalendar(){const input=document.getElementById('reminderDate');if(!input)return;const current=parseJalaliInput(input.value);if(current){jalaliViewYear=current.jy;jalaliViewMonth=current.jm}else{const now=new Date();[jalaliViewYear,jalaliViewMonth]=gregorianToJalali(now.getFullYear(),now.getMonth()+1,now.getDate())}renderJalaliCalendar()}
function shiftJalaliMonth(delta){if(jalaliViewYear===null)openJalaliCalendar();jalaliViewMonth+=delta;if(jalaliViewMonth<1){jalaliViewMonth=12;jalaliViewYear--}else if(jalaliViewMonth>12){jalaliViewMonth=1;jalaliViewYear++}renderJalaliCalendar()}
function renderJalaliCalendar(){const box=document.getElementById('jalaliCalendar');if(!box||jalaliViewYear===null)return;const first=jalaliToGregorian(jalaliViewYear,jalaliViewMonth,1);const weekday=(new Date(`${first}T12:00:00`).getDay()+1)%7;const length=jalaliMonthLength(jalaliViewYear,jalaliViewMonth);const selected=parseJalaliInput(document.getElementById('reminderDate')?.value||'');const now=new Date();const today=gregorianToJalali(now.getFullYear(),now.getMonth()+1,now.getDate());let cells='';for(let i=0;i<weekday;i++)cells+='<span class="jalali-empty"></span>';for(let d=1;d<=length;d++){const isToday=today[0]===jalaliViewYear&&today[1]===jalaliViewMonth&&today[2]===d;const isSelected=selected&&selected.jy===jalaliViewYear&&selected.jm===jalaliViewMonth&&selected.jd===d;cells+=`<button type="button" class="jalali-day${isToday?' today':''}" style="${isSelected?'background:#d9b66f;border-color:#c5a45e;font-weight:bold;':''}" onclick="selectJalaliDay(${d})">${persianDigits(d)}</button>`}box.innerHTML=`<div class="jalali-calendar"><div class="jalali-cal-head"><button type="button" onclick="shiftJalaliMonth(-1)" aria-label="ماه قبل">‹</button><strong>${jalaliMonthNames[jalaliViewMonth-1]} ${persianDigits(jalaliViewYear)}</strong><button type="button" onclick="shiftJalaliMonth(1)" aria-label="ماه بعد">›</button></div><div class="jalali-weekdays">${jalaliWeekNames.map(x=>`<span>${x}</span>`).join('')}</div><div class="jalali-days">${cells}</div><button type="button" class="btn ghost" onclick="closeJalaliCalendar()">بستن تقویم</button></div>`}
function selectJalaliDay(day){const input=document.getElementById('reminderDate');if(!input)return;input.value=`${persianDigits(jalaliViewYear)}/${persianDigits(String(jalaliViewMonth).padStart(2,'0'))}/${persianDigits(String(day).padStart(2,'0'))}`;closeJalaliCalendar()}

function formatReminderDate(r){try{const d=new Date(`${r.date}T${r.time||'09:00'}:00`);const j=gregorianToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());const date=`${j[0]}/${String(j[1]).padStart(2,'0')}/${String(j[2]).padStart(2,'0')}`;return `${date}، ساعت ${d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}`}catch(e){return `${r.date||''} ${r.time||''}`}}
async function requestNotificationPermission(){const status=document.getElementById('notificationStatus');if(!('Notification' in window)){if(status)status.textContent='این مرورگر از اعلان‌های گوشی پشتیبانی نمی‌کند. می‌توانید یادآورها را داخل سایت ببینید.';return}if(!window.isSecureContext){if(status)status.textContent='برای فعال‌سازی اعلان‌ها، سایت باید با HTTPS باز شود.';return}if(Notification.permission==='granted'){if(status)status.textContent='اجازه اعلان‌های گوشی فعال است.';return}if(Notification.permission==='denied'){if(status)status.textContent='اعلان‌ها قبلاً رد شده‌اند. از تنظیمات سایت در مرورگر، اعلان‌ها را فعال کنید.';return}try{const permission=await Notification.requestPermission();if(status)status.textContent=permission==='granted'?'اجازه اعلان‌های گوشی فعال شد.':'اجازه اعلان داده نشد؛ یادآورها فقط داخل سایت نمایش داده می‌شوند.'}catch(e){if(status)status.textContent='امکان درخواست اجازه اعلان وجود نداشت. دکمه فعال‌سازی را دوباره بزنید.'}}

function checkReminders(){const now=Date.now();let items=getReminders(),changed=false;for(const r of items){const when=localDateTime(r).getTime();if(!r.notified&&Number.isFinite(when)&&when<=now){r.notified=true;r.notifiedAt=new Date().toISOString();changed=true;showPhoneNotification('یادآور پرونده | حقوق کربلایی',`${r.case||'پرونده'}: ${r.action||'زمان پیگیری پرونده رسیده است.'}`,`klow-${r.id}`)}}if(changed)setReminders(items);if(document.getElementById('remindersList'))renderReminders()}

function saveReminder(fd){const d=Object.fromEntries(fd.entries());if(!d.case||!d.date||!d.time||!d.action){alert('عنوان پرونده، تاریخ شمسی، ساعت و موضوع یادآوری را کامل کنید.');return}const parsed=parseJalaliInput(d.date);if(!parsed){alert('تاریخ شمسی معتبر نیست. تاریخ را به شکل ۱۴۰۵/۰۸/۲۰ وارد کنید.');return}const when=new Date(`${parsed.iso}T${normalizeDigits(d.time)}:00`);if(!Number.isFinite(when.getTime())){alert('تاریخ یا ساعت معتبر نیست.');return}if(when.getTime()<=Date.now()){alert('زمان یادآوری باید در آینده باشد.');return}const items=getReminders();items.push({id:String(Date.now()),case:d.case,date:parsed.iso,time:normalizeDigits(d.time),jalaliDate:`${parsed.jy}/${String(parsed.jm).padStart(2,'0')}/${String(parsed.jd).padStart(2,'0')}`,action:d.action,notes:d.notes||'',createdAt:new Date().toISOString(),notified:false});try{setReminders(items);renderReminders();const st=document.getElementById('reminderSaveStatus');if(st)st.textContent='یادآوری با تاریخ شمسی روی همین گوشی ذخیره شد.';const form=document.getElementById('entry');if(form)form.reset();checkReminders()}catch(e){alert('ذخیره انجام نشد. فضای ذخیره‌سازی مرورگر را بررسی کنید.')}}

rm.addEventListener('submit',async e=>{e.preventDefault();if(isTracking){saveReminder(new FormData(e.target));return}const fd=new FormData(e.target);const submit=form.querySelector('button[type=submit]');if(submit){submit.disabled=true;submit.textContent='در حال بررسی نوع درخواست…'}try{const mismatch=await detectWrongService(id,fd);if(mismatch){showServiceMismatch(id,mismatch,fd);return}generate(id,fd)}finally{if(submit){submit.disabled=false;submit.textContent='تهیه پیش‌نویس'}}});if(isTracking){renderReminders();requestNotificationPermission()}}

function cleanFinalText(value){return String(value||'').replace(/```[\s\S]*?```/g,m=>m.replace(/```[a-z]*\n?/gi,'').replace(/```/g,'')).replace(/^\s{0,3}#{1,6}\s*/gm,'').replace(/\*\*(.*?)\*\*/g,'$1').replace(/__(.*?)__/g,'$1').replace(/(?<!\*)\*(?!\s)(.*?)(?<!\s)\*(?!\*)/g,'$1').replace(/(?<!_)_(?!\s)(.*?)(?<!\s)_(?!_)/g,'$1').replace(/^\s*[-*+]\s+/gm,'').replace(/^\s*>\s?/gm,'').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'$1').trim()}

function formatVerifiedLegalSources(){return (lastLegalSources||[]).slice(0,2).map((src,i)=>{if(typeof src==='string')return `${i+1}. ${src}`;const law=src.law_name||src.lawName||src.law||src.title||src.name||'قانون بازیابی‌شده از بانک';const article=src.article_number||src.articleNumber||src.article_no||src.article||src.number||'';const reason=src.relevance||src.reason||src.relation||'رکورد بازیابی‌شده از بانک قوانین؛ ارتباط نهایی باید با موضوع پرونده تطبیق داده شود';return `${i+1}. ${law}${article?'، ماده '+article:''}؛ ${reason}`}).join('\n')}

async function detectWrongService(id,fd){if(!['consult','notice','petition','complaint','brief','adminletter'].includes(id))return null;const d=Object.fromEntries(fd.entries());const joined=Object.values(d).filter(Boolean).join(' ');const local=heuristicService(joined);const labels={notice:'اظهارنامه',petition:'دادخواست',complaint:'شکواییه',brief:'لایحه',adminletter:'نامه یا درخواست اداری',consult:'مشاوره حقوقی'};if(local&&local.service!==id&&local.scores[id]===0)return {service:local.service,label:labels[local.service],reason:'بر اساس کلمات و هدفی که وارد کرده‌اید'};try{const prompt=`نوع خدمت مناسب را برای متن کاربر تشخیص بده. گزینه‌های مجاز: notice, petition, complaint, brief, adminletter, consult. notice=اظهارنامه برای مطالبه یا اعلام رسمی به مخاطب؛ petition=دادخواست برای طرح دعوای حقوقی؛ complaint=شکواییه برای گزارش جرم؛ brief=لایحه برای دفاع یا توضیح در پرونده موجود؛ adminletter=نامه یا درخواست رسمی اداری خطاب به اداره یا سازمان؛ consult=مشاوره وقتی هنوز نوع سند مشخص نیست. اگر اطلاعات برای تشخیص کافی نیست، service را برابر ${id} قرار بده. فقط JSON معتبر با کلیدهای service و reason برگردان، بدون هیچ متن اضافه. اطلاعات کاربر: ${joined}`;const raw=await requestAi(prompt,'classify_service',d,'','');const match=raw.match(/\{[\s\S]*\}/);if(match){const obj=JSON.parse(match[0]);const valid=['notice','petition','complaint','brief','adminletter','consult'];if(valid.includes(obj.service)&&obj.service!==id)return {service:obj.service,label:labels[obj.service],reason:String(obj.reason||'بر اساس هدفی که در متن توضیح داده‌اید')}}}catch(e){}return null}
function showServiceMismatch(id,found,fd){const labels={notice:'اظهارنامه',petition:'دادخواست',complaint:'شکواییه',brief:'لایحه',adminletter:'نامه یا درخواست اداری',consult:'مشاوره حقوقی'};const out=document.getElementById('output');if(!out)return;out.innerHTML=`<div class="panel"><h3>احتمالاً بخش دیگری مناسب‌تر است</h3><p class="hint">${escapeHtml(found.reason||'بررسی هوشمند متن شما نشان می‌دهد خدمت دیگری ممکن است مناسب‌تر باشد.')}.</p><div class="notice">شما وارد بخش «${escapeHtml(labels[id]||id)}» شده‌اید؛ متن شما بیشتر به «${escapeHtml(found.label)}» شباهت دارد. این پیشنهاد قطعی نیست و در موارد مبهم بهتر است ابتدا مشاوره بگیرید.</div><button class="btn gold" onclick="moveToService('${found.service}')">رفتن به بخش ${escapeHtml(found.label)} و حفظ اطلاعات</button><button class="btn ghost" onclick="continueCurrentService()">ادامه در بخش فعلی</button></div>`;window.pendingServiceData={id,values:Object.fromEntries(fd.entries())};out.scrollIntoView({behavior:'smooth',block:'start'})}
function moveToService(service){const pending=window.pendingServiceData;if(!pending)return;const sourceId=pending.id,oldValues=pending.values||{};const sourceFields=config[sourceId]?.fields||[];const sourceLabels=Object.fromEntries(sourceFields.map(f=>[f[0],f[1]]));openService(service);const form=document.getElementById('entry');if(!form){window.pendingServiceData=null;return}const targets={};for(const el of Array.from(form.elements||[])){if(el.name)targets[el.name]=el}const semanticAliases={sender:['sender','name','plaintiff','complainant'],recipient:['recipient','receiver','defendant','accused'],subject:['subject','topic'],claim:['claim','subject','topic'],story:['story','purpose','goal','details'],evidence:['evidence','attachments'],attachments:['attachments','evidence'],case:['case'],court:['court'],role:['role'],value:['value'],city:['city'],phone:['phone'],service:['service'],date:['date'],time:['time'],action:['action'],notes:['notes']};const preferred={notice:{sender:'sender',recipient:'receiver',subject:'subject',claim:'subject'},petition:{sender:'plaintiff',recipient:'defendant',subject:'claim',claim:'claim'},complaint:{sender:'complainant',recipient:'accused',subject:'subject',claim:'subject'},adminletter:{sender:'sender',recipient:'recipient',subject:'subject',claim:'subject'},brief:{sender:'story',recipient:'story',subject:'story',claim:'story'}};const used=new Set();const leftovers=[];function setValue(key,value){const el=targets[key];if(!el||!value)return false;const existing=String(el.value||'').trim();el.value=existing?existing+'\n'+value:value;used.add(key);return true}for(const [key,raw] of Object.entries(oldValues)){const value=String(raw||'').trim();if(!value)continue;let target=null;const pref=preferred[service]||{};if(pref[key]&&targets[pref[key]])target=pref[key];if(!target&&targets[key])target=key;if(!target){let semantic=key;if(['receiver','recipient','defendant','accused'].includes(key))semantic='recipient';else if(['sender','name','plaint function countExactOccurrences(haystack,needle){if(!needle)return 0;let count=0,pos=0;while((pos=haystack.indexOf(needle,pos))!==-1){count++;pos+=needle.length}return count}
function parseRevisionPatch(raw){let text=String(raw||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');const match=text.match(/\{[\s\S]*\}/);if(!match)return null;try{const obj=JSON.parse(match[0]);if(!obj||(!Array.isArray(obj.changes)&&!Array.isArray(obj.insertions)))return null;return obj}catch(e){return null}}
function applyRevisionPatch(previous,patch){let result=String(previous||''),applied=0,skipped=[];for(const change of (patch.changes||[])){const target=String(change.target_text||change.target||'');const replacement=String(change.replacement_text??change.replacement??'');if(!target){skipped.push('یک اصلاح بدون متن دقیقِ هدف نادیده گرفته شد.');continue}const count=countExactOccurrences(result,target);if(count!==1){skipped.push(`اصلاح «${target.slice(0,80)}» اعمال نشد؛ متن هدف ${count===0?'پیدا نشد':'بیش از یک بار تکرار شده است'}.`);continue}result=result.replace(target,replacement);applied++}for(const insertion of (patch.insertions||[])){const anchor=String(insertion.after_text||insertion.anchor_text||insertion.target_text||'');const addition=String(insertion.text||insertion.insertion_text||'');if(!anchor||!addition){skipped.push('یک اطلاعات جدید به دلیل نداشتن محل درج دقیق، اعمال نشد.');continue}const count=countExactOccurrences(result,anchor);if(count!==1){skipped.push(`اطلاعات جدید درج نشد؛ محل دقیق «${anchor.slice(0,80)}» ${count===0?'پیدا نشد':'تکراری است'}.`);continue}const before=String(insertion.position||'after')==='before';result=result.replace(anchor,before?addition+anchor:anchor+addition);applied++}return {text:result,applied,skipped}}
async function reviseDraft(){const out=document.getElementById('output');if(!out)return;const finalArea=out.querySelector('#finalText');const notesArea=out.querySelector('#correctionNotes');const status=out.querySelector('#draftStatus');const btn=out.querySelector('#reviseBtn');if(!finalArea||!notesArea)return;const corrections=notesArea.value.trim();if(!corrections){if(status)status.textContent='ابتدا اصلاحات یا اطلاعات تکمیلی را بنویسید.';return}const previous=finalArea.value;if(!previous.trim()){if(status)status.textContent='ابتدا متن اولیه را تهیه کنید.';return}if(btn){btn.disabled=true;btn.textContent='در حال اعمال اصلاحات دقیق…'}if(status)status.textContent='هوش مصنوعی محل هر اصلاح را مشخص می‌کند؛ فقط بندهای هدف تغییر می‌کنند و بقیه متن عیناً حفظ می‌شود…';const d={};const form=document.getElementById('entry');if(form)for(const [k,v] of new FormData(form).entries())d[k]=v;const prompt=`وظیفه تو اصلاح محدود متن حقوقی است. بسیار مهم: هرگز متن کامل جدید تولید نکن و هرگز متن قبلی را بازنویسی نکن. فقط یک JSON معتبر تولید کن که شامل تغییرات موضعی باشد و هیچ متن دیگری نداشته باشد. قالب دقیق: {"changes":[{"target_text":"یک قطعه دقیق و عیناً کپی‌شده از متن قبلی که باید تغییر کند","replacement_text":"نسخه اصلاح‌شده همان قطعه با حفظ همه اطلاعات مربوط"}],"insertions":[{"after_text":"قطعه دقیق و یکتای موجود در متن قبلی که اطلاعات باید پس از آن درج شود","text":"اطلاعات جدید در محل مناسب","position":"after"}],"explanation":"توضیحات تکمیلی خارج از متن نهایی","related_laws":[{"law_name":"عنوان قانون فقط از نتایج SQL","article_number":"شماره ماده فقط از نتایج SQL","reason":"دلیل ارتباط با موضوع"}]}. اگر اصلاحی لازم نیست آرایه‌ها را خالی بگذار. target_text و after_text باید دقیقاً از متن قبلی کپی شوند و تا حد امکان یک جمله یا بند مشخص باشند، نه یک عبارت تکراری یا کل سند. اگر قطعه هدف دقیقاً قابل تشخیص نیست، آن اصلاح را در changes/insertions قرار نده و ابهام را در explanation گزارش کن.

قواعد اصلاح: هر جمله و بندی که به اصلاح جدید مربوط نیست باید بدون هیچ تغییر، حذف، جابه‌جایی یا بازنویسی در متن اصلی باقی بماند. نام و مشخصات، عنوان موضوع، خواسته، شاکی/مشتکی‌عنه، خواهان/خوانده، مخاطب، مرجع رسیدگی، شماره پرونده، مبلغ و دلایل را از روی معنای اطلاعات در جای درست قرار بده، حتی اگر کاربر آن را در فیلد اشتباه نوشته باشد. اصلاحات را به انتهای سند اضافه نکن؛ فقط در جای مرتبط تغییر بده یا درج کن.

قواعد تاریخ: هر تاریخ را فقط به همان رویداد یا سندی مرتبط کن که کاربر درباره آن گفته است. تاریخ سند، تاریخ ابلاغ، تاریخ قرارداد، تاریخ پرداخت، تاریخ واقعه و تاریخ جلسه ممکن است متفاوت باشند. هرگز تاریخ جدید را به‌صورت سراسری جایگزین تاریخ‌های قبلی نکن. تاریخ قبلی را فقط اگر کاربر صریحاً همان تاریخِ همان رویداد را اصلاح کرده، جایگزین کن. اگر محل تاریخ مبهم است، آن را تغییر نده و ابهام را در explanation بنویس. همین قاعده برای نام‌ها و مبالغ مستقل برقرار است.

مواد قانونی: سرور باید از Cloudflare D1، binding=LEGAL_DB و جدول legal_articles جست‌وجوی SQL واقعی انجام داده باشد. در related_laws حداکثر دو ماده مرتبط را فقط از رکوردهای واقعی بازیابی‌شده معرفی کن. هرگز ماده یا شماره‌ای را حدس نزن. اگر منبع SQL در دسترس نیست، related_laws را خالی بگذار و در explanation بگو منبع قابل‌تأیید دریافت نشده است. مواد قانونی و توضیحات، جزو متن سند نیستند. در انتهای explanation این جمله را اضافه کن: «این متن صرفاً مشاوره هوش مصنوعی است؛ برای بررسی دقیق‌تر با خانم نسرین کربلایی تماس بگیرید: ۰۹۳۳۵۷۷۰۱۷۵.»

متن قبلی (مرجع دقیق برای target_text):\n${previous}\n
اطلاعات فرم اصلی: ${JSON.stringify(d)}\n
اصلاحات جدید فقط برای این نوبت: ${corrections}`;try{const raw=await requestAi(prompt,'legal_revision_patch',d,previous,corrections);const patch=parseRevisionPatch(raw);if(!patch){if(status)status.textContent='پاسخ اصلاحات ساختاری قابل‌اعتماد نبود؛ متن قبلی بدون هیچ تغییری حفظ شد. دوباره تلاش کنید یا اصلاح را دقیق‌تر مشخص کنید.';return}const result=applyRevisionPatch(previous,patch);if(result.applied===0){if(status)status.textContent='هیچ تغییری با اطمینان قابل اعمال نبود؛ متن قبلی دست‌نخورده باقی ماند. توضیحات تکمیلی را بررسی کنید.';const ex=document.getElementById('explanationText');if(ex)ex.textContent=ensureExplanationDisclaimer(String(patch.explanation||'اصلاح به دلیل نامشخص بودن محل دقیق، اعمال نشد.'));return}finalArea.value=result.text;const ex=document.getElementById('explanationText');let explanation=String(patch.explanation||'');if(ex)ex.textContent=ensureExplanationDisclaimer(explanation||'اصلاحات موضعی اعمال شد.');if(status)status.textContent=`${result.applied} اصلاح موضعی اعمال شد؛ سایر متن عیناً حفظ شد.${result.skipped.length?' برخی موارد مبهم اعمال نشدند و در توضیحات تکمیلی گزارش شده‌اند.':''}`;if(result.skipped.length&&ex)ex.textContent=ensureExplanationDisclaimer((explanation?explanation+'\n\n':'')+'موارد اعمال‌نشده:\n'+result.skipped.join('\n'))}catch(e){if(status)status.textContent='بازنویسی امن انجام نشد و متن قبلی بدون تغییر حفظ شد. اتصال سرویس را در بخش راهنما بررسی کنید.'}finally{if(btn){btn.disabled=false;btn.textContent='اعمال اصلاحات و بازنویسی متن نهایی'}}}

function saveDraft(){const area=document.getElementById('finalText')||document.getElementById('draftText');if(!area){alert('ابتدا یک متن تهیه کنید.');return}const content=cleanFinalText(area.value);if(!content){alert('متنی برای ذخیره وجود ندارد.');return}const title=config[current]?.title||'پیش‌نویس حقوقی';let arr=getSaved();try{if(editingDraftId!==null){const idx=arr.findIndex(x=>String(x.id)===String(editingDraftId));if(idx>=0){arr[idx]={...arr[idx],title,content,corrections:document.getElementById('correctionNotes')?.value||arr[idx].corrections||'',date:new Date().toLocaleDateString('fa-IR'),savedAt:new Date().toISOString()};setSaved(arr);const status=document.getElementById('draftStatus');if(status)status.textContent='تغییرات همین پیش‌نویس ذخیره شد.';else alert('تغییرات همین پیش‌نویس ذخیره شد.');return}}const id=Date.now();arr.unshift({id,title,content,corrections:document.getElementById('correctionNotes')?.value||'',service:current||'',date:new Date().toLocaleDateString('fa-IR'),savedAt:new Date().toISOString()});setSaved(arr);const status=document.getElementById('draftStatus');if(status)status.textContent='پیش‌نویس با موفقیت ذخیره شد.';else alert('پیش‌نویس با موفقیت ذخیره شد.')}catch(e){alert('ذخیره‌سازی انجام نشد؛ فضای ذخیره‌سازی مرورگر را بررسی کنید.')}}
function copyDraft(){const el=document.getElementById('finalText')||document.getElementById('draftText');if(!el)return;const text=cleanFinalText(el.value);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>alert('متن نهایی کپی شد.')).catch(()=>fallbackCopy(el,text))}else fallbackCopy(el,text)}function fallbackCopy(el,text){el.value=text;el.select();try{document.execCommand('copy');alert('متن نهایی کپی شد.')}catch(e){alert('متن را انتخاب و دستی کپی کنید.')}}
function printDraft(){const el=document.getElementById('finalText')||document.getElementById('draftText');if(!el)return;const t=cleanFinalText(el.value);const w=window.open('','_blank');if(!w){alert('برای چاپ، اجازه بازشدن پنجره را بدهید.');return}w.document.write(`<html lang="fa" dir="rtl"><meta charset="utf-8"><title>پیش‌نویس حقوقی</title><style>body{font-family:Tahoma,Arial;padding:35px;line-height:2;white-space:pre-wrap}</style><body>${escapeHtml(t)}</body></html>`);w.document.close();w.focus();w.print()}
function saved(){const arr=getSaved();main.innerHTML=`<div class="section-title"><h3>پیش‌نویس‌های من</h3><span>ذخیره‌شده روی همین دستگاه</span></div>${arr.length?arr.map(x=>`<div class="saved-item"><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.date)}</p><button class="btn ghost" onclick="viewSaved(${x.id})">مشاهده</button><button class="btn ghost" onclick="deleteSaved(${x.id})">حذف</button></div>`).join(''):`<div class="empty">هنوز پیش‌نویسی ذخیره نکرده‌اید.<br>پس از تهیه متن، روی «ذخیره پیش‌نویس» بزنید.</div>`}`};function viewSaved(id){const x=getSaved().find(a=>String(a.id)===String(id));if(!x)return;editingDraftId=x.id;current=x.service||null;main.innerHTML=`<button class="back" onclick="editingDraftId=null;saved()">← بازگشت</button><div class="panel"><h3>${escapeHtml(x.title)}</h3><div class="field"><label for="finalText">متن نهایی قابل ویرایش</label><textarea id="finalText" style="min-height:400px">${escapeHtml(cleanFinalText(x.content))}</textarea></div><button class="btn gold" onclick="saveDraft()">ذخیره تغییرات همین پیش‌نویس</button><button class="btn" onclick="copyDraft()">کپی متن</button><button class="btn ghost" onclick="printDraft()">چاپ / ذخیره PDF</button></div>`}function deleteSaved(id){if(confirm('این پیش‌نویس حذف شود؟')){setSaved(getSaved().filter(x=>x.id!==id));saved()}}
function guide(){main.innerHTML=`<div class="section-title"><h3>راهنمای استفاده</h3><span>چند نکته مهم</span></div><div class="panel"><h3>قبل از تنظیم سند</h3><p class="hint">۱. اطلاعات را دقیق و بدون حدس وارد کنید.<br>۲. تاریخ‌ها، مبالغ و مشخصات اشخاص را دوباره بررسی کنید.<br>۳. مدارک و مکاتبات را نگه دارید.<br>۴. مهلت‌های قانونی را بررسی کنید.<br>۵. متن نهایی را پیش از ثبت یا ارسال بخوانید.</p><button class="btn gold" onclick="testAiEndpoint()">آزمایش اتصال هوش مصنوعی</button><p id="aiStatus" class="hint" aria-live="polite">سرویس اصلی از مسیر داخلی سایت /api/legal-draft بررسی می‌شود. نیازی به واردکردن یا ذخیره آدرس نیست. برای نصب وب‌اپ، از منوی مرورگر گزینه «افزودن به صفحه اصلی» یا «نصب برنامه» را انتخاب کنید.</p><div class="notice">پیش‌نویس‌ها در حافظه همین مرورگر و روی همین دستگاه ذخیره می‌شوند. پاک‌کردن داده‌های مرورگر ممکن است آن‌ها را حذف کند. برای نگهداری بلندمدت، از متن نهایی PDF بگیرید یا آن را کپی کنید.</div></div>`}function contactMe(){main.innerHTML=`<div class="panel" style="text-align:center;padding:28px 18px"><div class="mark" style="margin:auto;width:65px;height:65px;font-size:34px">K</div><h2>مشاوره با خانم کربلایی</h2><p class="hint">برای درخواست مشاوره حقوقی، بررسی امکان قبول وکالت یا پرسش درباره خدمات، از شماره زیر استفاده کنید.</p><a class="btn" style="display:block;text-decoration:none" href="tel:09335770175">تماس با ۰۹۳۳۵۷۷۰۱۷۵</a><a class="btn ghost" style="display:block;text-decoration:none" href="https://wa.me/989335770175">گفت‌وگو در واتساپ</a><div class="notice" style="text-align:right">لطفاً اطلاعات حساس، رمزها و اطلاعات بانکی را ارسال نکنید. در نسخه فعلی، ثبت فرم درخواست به معنی ارسال آن برای دفتر نیست.</div><button class="btn ghost" onclick="goHome()">بازگشت به خانه</button></div>`}function about(){main.innerHTML=`<div class="panel" style="text-align:center;padding:28px 18px"><div class="mark" style="margin:auto;width:65px;height:65px;font-size:34px">K</div><h2 style="margin-bottom:4px">حقوق کربلایی</h2><p class="hint">دستیار حقوقی و تنظیم پیش‌نویس اسناد</p><p class="hint">مشاوره اولیه، تنظیم پیش‌نویس و راهنمای آماده‌سازی مدارک در یک برنامه فارسی.</p><a class="btn" style="display:block;text-decoration:none" href="tel:09335770175">مشاوره با خانم کربلایی: ۰۹۳۳۵۷۷۰۱۷۵</a><div class="notice" style="text-align:right">حقوق این سایت متعلق به خانم نسرین کربلایی می‌باشد. این برنامه جایگزین بررسی تخصصی پرونده یا سامانه رسمی قضایی نیست. اطلاعات پرونده را محرمانه نگه دارید و از واردکردن اطلاعات غیرضروری خودداری کنید.</div><p class="footer">نسخه نمایشی ۰.۲</p></div>`}function goHome(){tab='home';updateNav();home()}function updateNav(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;updateNav();({home,saved,guide,about}[tab]||home)()}));home();
const footerObserver=new MutationObserver(()=>{const old=main.querySelector('.legal-footer');if(!old){const existing=main.querySelector('.footer');if(existing)existing.remove();const f=document.createElement('div');f.className='footer legal-footer';f.innerHTML='حقوق این سایت متعلق به خانم نسرین کربلایی می‌باشد.<br><span style="float:right">طراح: محسن عبدی</span>';main.appendChild(f);}});footerObserver.observe(main,{childList:true});
</script></body></html>
