<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1422">
<meta name="color-scheme" content="light">
<title>k-low | مشاوره حقوقی خانم کربلایی</title>

<style>
:root{
 --navy:#0b1422;--navy2:#14243a;--gold:#d9b66f;
 --cream:#f7f2e8;--ink:#172033;--muted:#738093;
 --line:#e5dfd3;--white:#fff;
 --body-font:"B Nazanin","BNazanin","Vazirmatn","Noto Naskh Arabic",Tahoma,Arial,sans-serif;
 --title-font:"IranNastaliq","Iran Nastaliq","Noto Nastaliq Urdu","B Nazanin",Tahoma,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
 margin:0;background:#f4f0e8;color:var(--ink);
 font-family:var(--body-font);font-size:15px;
 -webkit-tap-highlight-color:transparent
}
button,input,textarea,select{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit}
.app{
 max-width:520px;margin:auto;min-height:100vh;min-height:100dvh;
 background:var(--cream);box-shadow:0 0 40px #0001
}
.top{
 background:linear-gradient(135deg,#0b1422,#1b2b40);
 color:#fff;padding:23px 18px 25px;border-radius:0 0 26px 26px;
 position:relative;overflow:hidden
}
.top:after{
 content:'⚖';position:absolute;left:14px;top:15px;
 font-size:82px;color:#d9b66f16;pointer-events:none
}
.brand{
 display:flex;align-items:center;gap:11px;position:relative;
 flex-wrap:wrap;z-index:1
}
.mark{
 width:49px;height:49px;flex:0 0 49px;border:1.5px solid var(--gold);
 border-radius:16px;display:grid;place-items:center;
 color:var(--gold);font-size:27px;font-weight:bold
}
.top-call{
 display:inline-flex;align-items:center;justify-content:center;
 text-decoration:none;background:var(--gold);color:#172033;
 padding:10px 11px;border-radius:11px;font-size:12px;
 font-weight:bold;white-space:nowrap;position:relative;z-index:2
}
.brand h1{margin:0;font-size:22px;letter-spacing:.2px}
.brand p{margin:5px 0 0;color:#c7d0dd;font-size:13px}
.welcome{margin-top:25px;position:relative;z-index:1}
.welcome small{color:var(--gold);font-size:13px}
.welcome h2{
 font-family:var(--title-font);font-size:29px;line-height:1.9;
 font-weight:normal;margin:5px 0
}
.welcome p{font-size:13px;color:#c6cfdb;line-height:2;margin:0}
.content{padding:18px 15px 100px}
.section-title{
 display:flex;align-items:center;justify-content:space-between;
 gap:8px;margin:8px 2px 13px
}
.section-title h3{margin:0;font-size:19px}
.section-title span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.tile{
 background:#fff;border:1px solid var(--line);border-radius:17px;
 padding:15px 13px;min-height:130px;text-align:right;
 box-shadow:0 5px 14px #1b2b4008;color:var(--ink);width:100%
}
.tile:active{transform:scale(.985)}
.ico{
 width:40px;height:40px;border-radius:13px;display:grid;
 place-items:center;background:#f7f0df;color:#9c762e;
 font-size:22px;margin-bottom:12px;flex-shrink:0
}
.tile b{display:block;font-size:15px}
.tile small{
 display:block;color:var(--muted);font-size:12px;
 line-height:1.8;margin-top:6px
}
.wide{
 margin-top:14px;border-radius:17px;padding:15px;
 background:linear-gradient(115deg,#17283e,#0b1422);
 color:white;display:flex;align-items:center;gap:13px
}
.wide .ico{margin:0;background:#d9b66f20;color:var(--gold)}
.wide b{font-size:15px}
.wide p{font-size:12px;line-height:1.9;color:#cbd4e0;margin:5px 0 0}
.panel{
 background:#fff;border:1px solid var(--line);border-radius:18px;
 padding:16px;margin-top:12px
}
.panel h3{margin:0 0 7px;font-size:20px}
.hint{font-size:13px;color:var(--muted);line-height:2;margin:0 0 15px}
.field{margin:14px 0}
.field label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
.field input,.field textarea,.field select{
 width:100%;min-width:0;border:1px solid #ddd6c9;border-radius:11px;
 background:#fff;padding:12px;color:#172033;outline:none;font-size:14px;
 font-family:var(--body-font)
}
.field textarea{min-height:105px;resize:vertical;line-height:2}
.field input:focus,.field textarea:focus,.field select:focus{
 border-color:#c5a45e;box-shadow:0 0 0 3px #d9b66f20
}
.btn{
 border:0;border-radius:12px;padding:13px 15px;background:var(--navy);
 color:white;font-weight:bold;font-size:14px;width:100%;margin-top:8px;
 text-align:center;display:block;text-decoration:none;line-height:1.7
}
.btn.gold{background:var(--gold);color:#1b2432}
.btn.ghost{background:#f4efe5;color:#293448;border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:wait}
.back{
 border:0;background:transparent;color:#98732e;font-size:14px;
 padding:0 0 14px;font-weight:bold
}
.result{
 background:#fffdf8;border:1px solid #d8c79e;border-radius:14px;
 padding:15px;white-space:pre-wrap;line-height:2.2;font-size:15px;
 min-height:120px;overflow-wrap:anywhere;font-family:var(--body-font)
}
.notice{
 font-size:12px;color:#776642;line-height:2;
 background:#faf3df;border-radius:11px;padding:11px;margin-top:12px
}
.status{font-size:12px;line-height:1.9;margin:9px 0;color:#536174}
.ai-badge{
 display:inline-block;background:#e8f2e9;color:#25613a;
 padding:5px 9px;border-radius:20px;font-size:12px;margin:8px 0
}
.source-box{
 background:#f7f9fc;border:1px solid #dfe5ec;
 border-radius:12px;padding:12px;margin-top:12px;
 font-size:13px;line-height:2
}
.source-box h4{margin:0 0 8px;font-size:15px}
.source-item{border-top:1px solid #e1e5ea;padding:8px 0}
.source-item:first-of-type{border-top:0}
.bottom{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(520px,100%);display:flex;justify-content:space-around;
 background:#0b1422;color:#aeb8c7;
 padding:10px 5px calc(10px + env(safe-area-inset-bottom));
 z-index:5;border-radius:17px 17px 0 0
}
.bottom button{
 border:0;background:none;color:inherit;font-size:12px;
 display:flex;flex-direction:column;gap:4px;align-items:center;
 padding:3px 8px
}
.bottom button span{font-size:20px}
.bottom button.active{color:var(--gold)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 5px;line-height:2}
.saved-item{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;background:#fff}
.saved-item b{font-size:15px}
.saved-item p{font-size:12px;color:var(--muted);margin:7px 0}
.saved-item button{width:auto;display:inline-block;padding:8px 12px;margin:5px 4px 0 0;font-size:12px}
.footer{
 text-align:center;color:#777;font-size:12px;line-height:2;
 margin-top:22px;padding:14px 8px;border-top:1px solid var(--line)
}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
 outline:2px solid #c5a45e;outline-offset:2px
}
@media(max-width:370px){
 .top{padding:18px 13px 22px}
 .brand{gap:8px}
 .brand h1{font-size:19px}
 .top-call{font-size:11px;padding:9px}
 .welcome h2{font-size:25px}
 .content{padding-left:11px;padding-right:11px}
 .tile{padding:12px 10px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

<body>
<div class="app">
<header class="top">
 <div class="brand">
  <div class="mark">K</div>
  <div>
   <h1>k-low <span style="color:#d9b66f">KARBALAEI LAW</span></h1>
   <p>مشاوره حقوقی خانم کربلایی</p>
  </div>
  <a class="top-call" href="tel:09335770175">☎ مشاوره با خانم کربلایی</a>
 </div>
 <div class="welcome">
  <small>همراه شما در مسیر آگاهی حقوقی</small>
  <h2>حقوق خود را بشناسید.<br>آگاهانه‌تر تصمیم بگیرید.</h2>
  <p>مشاوره، تنظیم پیش‌نویس اسناد و درخواست ارتباط با دفتر حقوقی، در یک فضای یکپارچه.</p>
 </div>
</header>

<main id="main" class="content"></main>

<nav class="bottom">
 <button class="active" data-tab="home"><span>⌂</span>خانه</button>
 <button data-tab="saved"><span>▤</span>پیش‌نویس‌ها</button>
 <button data-tab="guide"><span>✧</span>راهنما</button>
 <button data-tab="about"><span>ⓘ</span>درباره</button>
</nav>
</div>

<script>
'use strict';

const PHONE='09335770175';
const OWNER='حقوق این نرم‌افزار متعلق به خانم نسرین کربلایی می‌باشد.';
const DEFAULT_ENDPOINT='/api/legal-draft';
const services=[
 {id:'consult',icon:'⚖',name:'مشاوره حقوقی',desc:'تحلیل مسئله و راهنمایی حقوقی'},
 {id:'notice',icon:'✉',name:'اظهارنامه',desc:'تنظیم پیش‌نویس اظهارنامه'},
 {id:'petition',icon:'▤',name:'دادخواست',desc:'تنظیم پیش‌نویس دادخواست'},
 {id:'complaint',icon:'⚑',name:'شکواییه',desc:'تنظیم پیش‌نویس شکایت'},
 {id:'brief',icon:'✎',name:'لایحه',desc:'تدوین دفاعیات و توضیحات'},
 {id:'adminletter',icon:'✉',name:'نامه یا درخواست اداری',desc:'نگارش نامه رسمی برای اداره یا سازمان'},
 {id:'tracking',icon:'◷',name:'پیگیری پرونده',desc:'یادداشت تاریخ‌ها و اقدامات'},
 {id:'request',icon:'☎',name:'درخواست مشاوره و وکالت',desc:'ثبت پیش‌نویس درخواست و تماس مستقیم'}
];

let tab='home',current=null;
const main=document.getElementById('main');

function getSaved(){
 try{
  const value=JSON.parse(localStorage.getItem('karloDrafts')||'[]');
  return Array.isArray(value)?value:[];
 }catch(e){return []}
}
function setSaved(value){
 try{localStorage.setItem('karloDrafts',JSON.stringify(value));return true}
 catch(e){alert('فضای ذخیره‌سازی مرورگر در دسترس نیست. متن را کپی کنید.');return false}
}
function escapeHtml(value){
 return String(value??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function footerHtml(){
 return `<div class="footer legal-footer">${OWNER}</div>`;
}
function addFooter(){
 if(!main.querySelector('.legal-footer'))main.insertAdjacentHTML('beforeend',footerHtml());
}
function getAiEndpoint(){
 try{return localStorage.getItem('karloAiEndpoint')||DEFAULT_ENDPOINT}
 catch(e){return DEFAULT_ENDPOINT}
}
function home(){
 main.innerHTML=`
 <div class="section-title"><h3>خدمات حقوقی</h3><span>انتخاب کنید و شروع کنید</span></div>
 <div class="tiles">${services.map(s=>`
 <button type="button" class="tile" onclick="openService('${s.id}')">
  <div class="ico">${s.icon}</div><b>${s.name}</b><small>${s.desc}</small>
 </button>`).join('')}</div>
 <button type="button" class="wide" style="width:100%;border:0;text-align:right" onclick="openService('request')">
  <div class="ico">☎</div><div><b>درخواست مشاوره و وکالت</b>
  <p>شرح درخواست را ثبت کنید یا مستقیماً با شماره ۰۹۳۳۵۷۷۰۱۷۵ تماس بگیرید.</p></div>
 </button>
 <button type="button" class="wide" style="width:100%;border:0;text-align:right" onclick="contactMe()">
  <div class="ico">✆</div><div><b>ارتباط با حقوق کربلایی</b>
  <p>تماس مستقیم با شماره ۰۹۳۳۵۷۷۰۱۷۵</p></div>
 </button>${footerHtml()}`;
}

const config={
 request:{
  title:'درخواست مشاوره و وکالت',
  intro:'اطلاعات تماس و خلاصه درخواست را وارد کنید. این فرم فعلاً روی همین دستگاه ذخیره می‌شود و به دفتر ارسال نمی‌شود.',
  fields:[
   ['name','نام و نام خانوادگی','text','نام شما'],
   ['phone','شماره تماس شما','tel','شماره‌ای برای تماس'],
   ['service','نوع درخواست','select','مشاوره حقوقی|درخواست قبول وکالت|تنظیم سند حقوقی|پیگیری درخواست قبلی'],
   ['topic','موضوع پرونده','text','مثلاً خانواده، ملکی، قرارداد، کیفری'],
   ['story','شرح درخواست','textarea','خلاصه موضوع، مهلت مهم و کمکی که نیاز دارید']
  ]
 },
 consult:{
  title:'مشاوره حقوقی',
  intro:'مسئله را با جزئیات بنویسید تا پاسخ حقوقی ساختارمند، نکات قانونی مرتبط و گام‌های بعدی آماده شود.',
  fields:[
   ['topic','موضوع یا حوزه مسئله','text','مثلاً قرارداد، خانواده، ملک، کار'],
   ['story','شرح کامل ماجرا','textarea','چه اتفاقی افتاده؟ تاریخ‌ها، اشخاص و جزئیات مرتبط را بنویسید.'],
   ['goal','نتیجه‌ای که می‌خواهید','textarea','می‌خواهید به چه نتیجه‌ای برسید؟'],
   ['city','شهر محل رسیدگی','text','مثلاً تهران یا کرج']
  ]
 },
 notice:{
  title:'تنظیم اظهارنامه',
  intro:'اطلاعات را وارد کنید تا پیش‌نویس رسمی و قابل بازبینی تهیه شود.',
  fields:[
   ['sender','نام اظهارکننده','text','نام و نام خانوادگی'],
   ['receiver','نام مخاطب','text','نام شخص یا شرکت'],
   ['subject','موضوع اظهارنامه','text','مثلاً مطالبه وجه یا ایفای تعهد'],
   ['story','شرح موضوع و خواسته','textarea','شرح دقیق، تاریخ‌ها، مبلغ و تعهد موردنظر'],
   ['date','تاریخ یا مهلت موردنظر','text','در صورت نیاز']
  ]
 },
 petition:{
  title:'تنظیم دادخواست',
  intro:'خواسته، شرح ادعا و مستندات را بنویسید تا پیش‌نویس منظم برای بررسی تهیه شود.',
  fields:[
   ['plaintiff','خواهان','text','نام و نام خانوادگی'],
   ['defendant','خوانده','text','نام شخص یا شخص حقوقی'],
   ['claim','خواسته دقیق','text','خواسته‌ای که از دادگاه دارید'],
   ['value','بهای خواسته (در صورت نیاز)','text','مبلغ و واحد آن'],
   ['story','شرح دادخواست','textarea','ماجرا، تعهدات، تاریخ‌ها و نتیجه مورد درخواست'],
   ['evidence','دلایل و پیوست‌ها','textarea','قرارداد، رسید، پیام‌ها و سایر مدارک']
  ]
 },
 complaint:{
  title:'تنظیم شکواییه',
  intro:'شرح واقعه و مدارک را وارد کنید. تشخیص عنوان اتهام به بررسی دقیق جزئیات نیاز دارد.',
  fields:[
   ['complainant','شاکی','text','نام و نام خانوادگی'],
   ['accused','مشتکی‌عنه','text','نام شخص یا در صورت نامشخص بودن، توضیح'],
   ['subject','موضوع شکایت','text','شرح کوتاه واقعه'],
   ['story','شرح واقعه','textarea','زمان، مکان، نحوه وقوع و افراد مرتبط'],
   ['evidence','دلایل و مدارک','textarea','مدارک، شاهدان و مستندات موجود']
  ]
 },
 brief:{
  title:'تنظیم لایحه',
  intro:'مرجع رسیدگی، سمت خود و نکات پرونده را وارد کنید تا پیش‌نویس دفاعیه تهیه شود.',
  fields:[
   ['court','مرجع رسیدگی / شعبه','text','مثلاً شعبه ... دادگاه ...'],
   ['case','شماره پرونده (اختیاری)','text','شماره پرونده یا بایگانی'],
   ['role','سمت شما در پرونده','select','خواهان|خوانده|شاکی|متهم|تجدیدنظرخواه|تجدیدنظرخوانده'],
   ['story','خلاصه پرونده و دفاعیات','textarea','موضوع پرونده و پاسخ شما به ادعاها'],
   ['evidence','دلایل و مستندات','textarea','اسناد و نکات مهم پرونده']
  ]
 },
 adminletter:{
  title:'نامه یا درخواست اداری',
  intro:'موضوع، مخاطب و خواسته خود را بنویسید تا نامه‌ای رسمی، محترمانه و متناسب با هدف شما تنظیم شود.',
  fields:[
   ['sender','نام درخواست‌کننده','text','نام و نام خانوادگی'],
   ['recipient','نام اداره یا مخاطب','text','مثلاً ریاست اداره یا مدیر سازمان'],
   ['subject','موضوع نامه','text','مثلاً درخواست رسیدگی به حقوق معوقه'],
   ['story','شرح موضوع و درخواست','textarea','شرح ماجرا، سوابق، تاریخ‌ها و نتیجه‌ای که می‌خواهید'],
   ['attachments','مدارک پیوست','textarea','در صورت وجود، نام مدارک و مستندات']
  ]
 },
 tracking:{
  title:'یادداشت پیگیری پرونده',
  intro:'اطلاعات را برای نظم شخصی ذخیره کنید. این بخش به سامانه قضایی متصل نیست و یادآور خودکار ارسال نمی‌کند.',
  fields:[
   ['case','عنوان یا شماره پرونده','text','نام کوتاه یا شماره پرونده'],
   ['date','تاریخ مهم','text','مثلاً ۱۴۰۵/۰۸/۲۰'],
   ['action','اقدام بعدی','textarea','چه کاری باید انجام دهید؟'],
   ['notes','یادداشت','textarea','توضیحات تکمیلی']
  ]
 }
};

function openService(id){
 current=id;
 const c=config[id];
 if(!c)return;
 main.innerHTML=`
 <button class="back" type="button" onclick="goHome()">← بازگشت به خانه</button>
 <div class="panel"><h3>${c.title}</h3><p class="hint">${c.intro}</p>
 <form id="entry">
 ${c.fields.map(f=>`
  <div class="field"><label for="field-${f[0]}">${f[1]}</label>
  ${f[2]==='textarea'
   ?`<textarea id="field-${f[0]}" name="${f[0]}" placeholder="${escapeHtml(f[3])}" ${f[0]==='story'?'required':''}></textarea>`
   :f[2]==='select'
    ?`<select id="field-${f[0]}" name="${f[0]}">${f[3].split('|').map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select>`
    :`<input id="field-${f[0]}" name="${f[0]}" type="${f[2]}" placeholder="${escapeHtml(f[3])}" ${['topic','sender','receiver','recipient','claim','complainant','court','subject'].includes(f[0])?'required':''}>`
  }</div>`).join('')}
 <button class="btn gold" type="submit">تهیه پیش‌نویس</button>
 </form></div><div id="output"></div>`;
 document.getElementById('entry').addEventListener('submit',e=>{
  e.preventDefault();generate(id,new FormData(e.target));
 });
}

function generateTemplate(id,fd){
 const d=Object.fromEntries(fd.entries());
 let text='';
 if(id==='request'){
  text=`درخواست مشاوره و وکالت | پیش‌نویس

نام متقاضی: ${d.name||'—'}
شماره تماس متقاضی: ${d.phone||'—'}
نوع درخواست: ${d.service||'—'}
موضوع پرونده: ${d.topic||'—'}

شرح درخواست:
${d.story||'—'}

شماره تماس حقوق کربلایی: ۰۹۳۳۵۷۷۰۱۷۵

توجه: این فرم در نسخه فعلی روی دستگاه ذخیره می‌شود و برای دفتر ارسال نشده است.`;

function renderSources(sources,found){
 const box=document.getElementById('legalSources');
 if(!box)return;
 let items=[];
 if(Array.isArray(sources))items=sources;
 else if(typeof sources==='string'&&sources.trim())items=[sources];
 if(!items.length&&Array.isArray(found))items=found;
 if(!items.length)return;
 box.innerHTML=`<div class="source-box"><h4>مستندات و منابع قانونی دریافتی</h4>
 ${items.map(item=>{
  if(typeof item==='string')return `<div class="source-item">${escapeHtml(item)}</div>`;
  const title=item.title||item.name||item.article||item.law||'منبع قانونی';
  const detail=item.text||item.content||item.description||item.citation||item.reference||'';
  return `<div class="source-item"><strong>${escapeHtml(title)}</strong>${detail?`<div>${escapeHtml(detail)}</div>`:''}</div>`;
 }).join('')}
 </div>`;
}

  const controller=new AbortController();

async function copyDraft(){
 const el=document.getElementById('draftText');
 if(!el)return;
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(el.value);
  }else{
   el.focus();el.select();
   if(!document.execCommand('copy'))throw new Error('copy failed');
  }
  alert('متن کپی شد.');
 }catch(e){
  el.focus();el.select();
  alert('متن انتخاب شد. اگر کپی نشد، گزینه کپی گوشی را انتخاب کنید.');
 }
}
